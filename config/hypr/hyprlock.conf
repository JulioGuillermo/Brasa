# Brasa · Redline for hyprlock: the same centered card as the login screen (greeter/), over the
# blurred wallpaper. Used on Hyprland and on sway/SwayFX (brasa-lock). hyprlock uses hyprlang, not Lua.
$font = Hack Nerd Font Propo

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 4, linear
    animation = fadeOut, 1, 4, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/.local/share/backgrounds/brasa.png
    color = rgba(00040fff)
    blur_passes = 3
    blur_size = 8
    brightness = 0.7
    vibrancy = 0.2
}

# Card
shape {
    monitor =
    size = 460, 660
    color = rgba(00040fc7)
    rounding = 24
    border_size = 1
    border_color = rgba(ff000073)
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(00000099)
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = Welcome back!
    font_size = 30
    font_family = $font
    color = rgba(ffffffff)
    position = 0, 265
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = $TIME
    font_size = 56
    font_family = $font
    color = rgba(ff0000ff)
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(ff000066)
    position = 0, 190
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 15
    font_family = $font
    color = rgba(c3cbe0ff)
    position = 0, 130
    halign = center
    valign = center
}

# Avatar (~/.face, linked by the installer to the account picture)
image {
    monitor =
    path = ~/.face
    size = 112
    rounding = -1
    border_size = 2
    border_color = rgba(d00000ff)
    position = 0, 30
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 14
    font_family = $font
    color = rgba(99ccffff)
    position = 0, -50
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 48
    outline_thickness = 1
    inner_color = rgba(08122bff)
    outer_color = rgba(2c3a5eff)
    check_color = rgba(99ccffee)
    fail_color = rgba(ff0000ff)
    font_color = rgb(255, 255, 255)
    font_family = $font
    fade_on_empty = false
    rounding = 14
    placeholder_text = <span foreground="##5a6a90">Password</span>
    fail_text = <span foreground="##ff0000">$PAMFAIL</span>
    dots_spacing = 0.3
    position = 0, -115
    halign = center
    valign = center
}

# Keyboard layout (click to switch on Hyprland)
label {
    monitor =
    text = $LAYOUT
    font_size = 12
    font_family = $font
    color = rgba(5a6a90ff)
    onclick = hyprctl switchxkblayout all next
    position = 0, -175
    halign = center
    valign = center
}

label {
    monitor =
    text = Enter to unlock
    font_size = 11
    font_family = $font
    color = rgba(5a6a90ff)
    position = 0, -270
    halign = center
    valign = center
}

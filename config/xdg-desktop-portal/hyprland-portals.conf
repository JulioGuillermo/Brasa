# Brasa: Hyprland's portals, as the system's hyprland-portals.conf, but no Inhibit portal. The GTK one
# only tells GNOME, so a browser playing a video asked it in vain and the screen locked anyway; without
# it, browsers use Wayland's idle inhibit, which swayidle follows (sway-portals.conf does the same).
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.Inhibit=none

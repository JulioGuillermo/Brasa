# Brasa remote session on mango (brasa-remote session, with "session wm mango"): the normal Brasa mango
# without a physical screen; brasa-remote sizes its one output and serves it over VNC or RDP.
# mango reads remote.conf, which brasa-gen writes from this file (see brasa.conf).
source=./config.conf
exec_once=$HOME/.local/bin/brasa-remote _session-vnc

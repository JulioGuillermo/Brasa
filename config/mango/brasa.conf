# Brasa · Redline for mango. Key bindings live in binds.conf, generated by brasa-gen from
# ~/.config/brasa/keys.tsv; keyboard.conf and cursor.conf hold your choices (brasa-keyboard, brasa-themes).
# mango reads config.conf, which brasa-gen writes from this file in the names the installed mango knows:
# 0.18 renamed most options, and this file uses the new ones.

# --- After a mango update the names may have changed: brasa-gen rewrites the files and reloads (it runs on
# every start and reload, the one line both versions read the same)
exec=~/.local/bin/brasa-gen --mango-check >/dev/null
# Brasa reloads by itself (Super+Shift+r), restoring what a reload resets
auto_reload_config=0

# --- Monitors: the laptop panel scaled like in sway and Hyprland
monitor_rule=name:eDP-1,scale:1.333333

# --- X11 apps (XWayland) see the screen at its real resolution instead of being drawn at 100 % and blown
# up (blurry with a fractional scale), as in Hyprland; brasa-monitors tells them the scale through Xft.dpi
xwayland_ignore_scale=1

# --- Environment
env=XCURSOR_THEME,Fuchsia-Red
env=XCURSOR_SIZE,24
env=QT_QPA_PLATFORMTHEME,qt5ct
cursor_theme=Fuchsia-Red
cursor_size=24

# --- Input (same as in sway, Hyprland and GNOME)
xkb_rules_layout=es,us
xkb_rules_variant=,altgr-intl
xkb_rules_options=compose:ins
repeat_rate=33
repeat_delay=500
sloppy_focus=1
tap_to_click=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
# Touchscreen and pen on the laptop panel, as in sway and Hyprland; a touch on an app that does not take
# touch input acts as a mouse click
touch_enable_mouse_emulation=1
device_rule=type:touch,monitor:eDP-1
device_rule=type:tablet,monitor:eDP-1

# --- Brasa · Redline look
border_px=1
border_radius=10
gap_inner_horizontal=4
gap_inner_vertical=4
gap_outer_horizontal=8
gap_outer_vertical=8
root_color=0x00040fff
border_color=0x0c1838ff
focus_color=0xd00000ff
urgent_color=0xffaa33ff
maximized_screen_color=0xd00000ff
scratchpad_color=0x4a0008ff
global_color=0x99ccffff
overlay_color=0xff7a3dff
drop_color=0xd0000055
split_color=0xff5050ff
unfocused_opacity=0.96
focused_opacity=1.0

blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=6
shadows_blur=12
shadows_color=0xff000022

# --- Animations: quick, overshooting a little and settling back (open the most, then move, then tag)
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
zoom_initial_ratio=0.87
zoom_end_ratio=0.87
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
tag_animation_direction=1
animation_duration_open=280
animation_duration_close=150
animation_duration_move=320
animation_duration_tag=280
animation_duration_focus=0
animation_curve_open=0.34,1.5,0.64,1
animation_curve_move=0.34,1.3,0.64,1
animation_curve_tag=0.34,1.2,0.64,1
animation_curve_close=0,0,1,1
animation_curve_focus=0.23,1,0.32,1
animation_curve_opacity_fade_in=0.5,0.5,0.75,1
animation_curve_opacity_fade_out=0.5,0.5,0.75,1

# --- Layouts: each tag keeps its own; Super+w goes through them in this order. The bar lists the tags
# with windows and the one in view (mango tells nothing more), so every tag but that one has windows
circle_layout=dwindle,tile,right_tile,center_tile,vertical_tile,deck,vertical_deck,grid,vertical_grid,fair,vertical_fair,scroller,vertical_scroller,monocle
tag_rule=id:*,layout_name:dwindle
dwindle_preserve_split=1
new_is_master=0
default_master_factor=0.55
scroller_default_proportion=0.5
# The widths Super+s goes through
scroller_proportion_preset=0.5,0.75,1.0
focus_cross_monitor=1
exchange_cross_monitor=1

# --- Windows: these open floating, and every floating window centred
window_rule=is_floating:1,app_id:^(pavucontrol|org.pulseaudio.pavucontrol|blueman-manager|nm-connection-editor|brasa-mem|org.brasa.[A-Za-z]+)$

# --- Layers: blur only behind the bar, menus and panels, as in Hyprland. mango blurs every layer, the
# full-screen invisible ones too (the islands' click catcher, the screenshot's selection), which blurred the
# whole screen. A later matching rule resets what it does not set, so the first one is the catch-all
layer_rule=no_blur:1,layer_name:^(?!(waybar|launcher|rofi|nwg-bar|swayosd|brasa-quick|swaync-control-center|swaync-notification-window)$)
# The island animates its own shape; the screenshot's frozen screen and selection show up at once
layer_rule=no_blur:1,no_animation:1,layer_name:^(brasa-island|brasa-freeze|selection)$

# --- Mouse: Super + drag moves, Super + right button resizes, Super + wheel changes tag
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# --- Touchpad gestures: three-finger horizontal swipe changes tag
gesturebind=none,left,3,viewtoright_have_client
gesturebind=none,right,3,viewtoleft_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview

# --- Overview (Super+o; Super+Shift+o puts a letter on each window) and the floating terminal (Super+º)
jump_label_decorate_font_desc=Hack Nerd Font Bold 16
jump_label_decorate_fg_color=0xffffffff
jump_label_decorate_bg_color=0x0c1838ee
jump_label_decorate_focus_fg_color=0xffffffff
jump_label_decorate_focus_bg_color=0xd00000ff
jump_label_decorate_border_color=0xd00000ff
window_rule=is_named_scratchpad:1,app_id:brasa.scratch
# X11 windows that choose their own place (TigerVNC's dialogs) open centered, like the Wayland ones: an
# offset from the centre is what makes mango place them, 1 % being too little to see
window_rule=offset_y:1,app_id:^Vncviewer$
scratchpad_width_ratio=0.7
scratchpad_height_ratio=0.6

# --- Your choices and the key bindings (brasa-gen creates the files): keyboard layouts, cursor, the
# layout each tag keeps (Super+w), the bindings
source=./keyboard.conf
source=./cursor.conf
source=./layouts.conf
source=./binds.conf

# --- Autostart
exec_once=$HOME/.local/bin/brasa-autostart

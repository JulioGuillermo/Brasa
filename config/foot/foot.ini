# Brasa · Redline for foot. alpha + blur=yes: Hyprland 0.56 only blurs foot when foot asks for it.
[main]
font=monospace:size=11

[colors-dark]
alpha=0.82
blur=yes
background=00050f

[csd]
color=000618
border-color=55ff0000

button-color=ff0000

button-minimize-color=ff1a1b26
button-maximize-color=ff1a1b26
button-close-color=ff0000

border-width=1
button-width=26

[bell]
system=yes
urgent=yes
notify=yes
command=paplay /usr/share/sounds/freedesktop/stereo/bell.oga
command-focused=no

# SwayFX effects
corner_radius 10
blur enable
blur_passes 2
blur_radius 5
shadows enable
shadow_blur_radius 8
shadow_color #ff000022
shadow_inactive_color #00000060
default_dim_inactive 0.06
dim_inactive_colors.unfocused #00040fff
# Bar, notifications, launcher and OSD: blur and rounded corners only (a red shadow looks like a halo
# there). blur_ignore_transparent keeps the blur to the visible cards: swaync's windows are larger than
# the cards and transparent, and would otherwise show a big blurred rectangle.
layer_effects "waybar" blur enable; blur_ignore_transparent enable; shadows disable; corner_radius 14
layer_effects "swaync-control-center" blur enable; blur_ignore_transparent enable; shadows disable
layer_effects "swaync-notification-window" blur enable; blur_ignore_transparent enable; shadows disable
layer_effects "launcher" blur enable; blur_ignore_transparent enable; shadows disable; corner_radius 14
layer_effects "rofi" blur enable; blur_ignore_transparent enable; shadows disable
layer_effects "swayosd" blur enable; blur_ignore_transparent enable; shadows disable

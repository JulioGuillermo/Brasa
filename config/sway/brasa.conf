# Shared part: look, input, outputs and autostart. Used by config (Super) and test.conf (Alt).

# --- Outputs and wallpaper
output * bg ~/.local/share/backgrounds/brasa.png fill #00040f
output eDP-1 scale 1.333333 adaptive_sync on

# --- Input (same as in GNOME)
input type:keyboard {
    xkb_layout es,us
    xkb_variant ,altgr-intl
    xkb_options compose:ins
    repeat_delay 500
    repeat_rate 33
}
input type:touchpad {
    tap enabled
    natural_scroll enabled
    dwt enabled
}
input type:touch map_to_output eDP-1
input type:tablet_tool map_to_output eDP-1
seat seat0 xcursor_theme Future-cyan-cursors 24
focus_follows_mouse yes

# --- Brasa · Redline look
font pango:Hack Nerd Font Propo 10
default_border pixel 1
default_floating_border pixel 1
titlebar_border_thickness 0
gaps inner 8
gaps outer 4
#                       border    backgr.   text      indicator child border
client.focused          #d00000   #00040f   #ffffff   #d00000   #d00000
client.focused_inactive #4a0008   #00040f   #5a6a90   #4a0008   #4a0008
client.unfocused        #0c1838   #00040f   #5a6a90   #0c1838   #0c1838
client.urgent           #ffaa33   #00040f   #ffffff   #ffaa33   #ffaa33

for_window [app_id="pavucontrol|org.pulseaudio.pavucontrol|blueman-manager|nm-connection-editor"] floating enable
for_window [window_role="pop-up|dialog"] floating enable
# Remote keyboard: in a VNC/RDP/VM viewer every key goes to the remote machine (brasa-autostart switches
# to this mode while one has the focus; Ctrl+Super+Escape leaves or re-enters it by hand)
mode "remote" {
    bindsym Ctrl+$mod+Escape exec ~/.local/bin/brasa-wm remote-keys
}

# Dialogs and other floating windows open centred, whatever position the app asks for
for_window [floating] move position center
floating_modifier $mod normal

# SwayFX effects (only with SwayFX; the installer links the right file)
include ~/.config/sway/fx.conf

# --- Key bindings (generated)
include ~/.config/sway/binds.conf

# --- Autostart
exec ~/.local/bin/brasa-autostart

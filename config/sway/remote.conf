# Brasa remote session (brasa-remote session): sway without a physical screen, one virtual output,
# wayvnc inside. Same look, bar, keys and apps as the normal session.
set $mod Mod4
include ~/.config/sway/brasa.conf

# sway's headless backend starts with one virtual output; brasa-remote sizes it (REMOTE_SIZE) and
# serves it over VNC
exec ~/.local/bin/brasa-remote _session-vnc
